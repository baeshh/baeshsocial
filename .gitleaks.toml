title = "BAESH gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documented placeholders"
paths = [
  '''backend/tests/''',
  '''backend/vitest\.config\.ts''',
  '''\.env\.example$''',
  '''package-lock\.json$''',
]
# Documentation placeholders such as YOUR_JWT_TOKEN.
regexes = [
  '''\bYOUR_[A-Z_]+\b''',
]
