# /etc/nginx/sites-available/baesh-production.conf (copy per environment, adjust server_name/paths)
# TLS certificates: certbot --nginx -d baesh.kr -d www.baesh.kr -d api.baesh.kr

limit_req_zone $binary_remote_addr zone=baesh_api:10m rate=20r/s;

upstream baesh_api_production {
  server 127.0.0.1:4000;
  keepalive 16;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name baesh.kr www.baesh.kr api.baesh.kr;
  return 301 https://$host$request_uri;
}

# Frontend (static build from the current release)
server {
  listen 443 ssl http2;
  server_name baesh.kr www.baesh.kr;
  root /srv/baesh/production/current/frontend/dist;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/baesh.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/baesh.kr/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.baesh.kr https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Public profile pages, robots.txt and the sitemap are rendered by the API (SEO router).
  location ~ ^/(u/|robots\.txt$|sitemap\.xml$) {
    proxy_pass http://baesh_api_production;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

# API
server {
  listen 443 ssl http2;
  server_name api.baesh.kr;

  ssl_certificate     /etc/letsencrypt/live/baesh.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/baesh.kr/privkey.pem;

  client_max_body_size 120m;
  proxy_read_timeout 120s;

  location / {
    limit_req zone=baesh_api burst=60 nodelay;
    proxy_pass http://baesh_api_production;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Brief PM2 reloads: retry once on the same upstream instead of surfacing a 502.
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;
  }

  # Ops ingestion is only for scripts running on this host.
  location /api/ops/ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://baesh_api_production;
    proxy_set_header Host $host;
  }

  access_log /var/log/nginx/baesh-api.access.log combined;
  error_log  /var/log/nginx/baesh-api.error.log warn;
}
